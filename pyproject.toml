[project]
name = "resolvehub"
version = "0.1.0"
description = "Support ticket tracker built on the Django admin"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
testpaths = ["tests", "accounts", "tickets"]
addopts = "--strict-markers"
# Catch code that will break on the next Django upgrade.
filterwarnings = ["error::django.utils.deprecation.RemovedInDjango60Warning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]
# Line length is the formatter's job; long help_text strings are fine.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "accounts", "tickets", "assistant"]
