{% load static %}
{% if show %}
<link rel="stylesheet" href="{% static 'assistant/assistant.css' %}">
<div id="rh-assistant" class="rh-assistant"
     data-endpoint="{{ endpoint }}" data-page="{{ page }}" data-model="{{ model }}" data-object-id="{{ object_id }}">
  <button type="button" class="rh-assistant-toggle" aria-expanded="false" aria-controls="rh-assistant-panel" aria-label="{{ toggle_label }}">
    <span class="rh-assistant-spark" aria-hidden="true">✦</span>
    <span class="rh-assistant-label-text">{{ toggle_label }}</span>
  </button>
  <section id="rh-assistant-panel" class="rh-assistant-panel" aria-label="ResolveHub assistant" hidden>
    <header class="rh-assistant-header">
      <strong>Assistant</strong>
      <span class="rh-assistant-scope">{{ scope }}</span>
      <button type="button" class="rh-assistant-close" aria-label="Close">&times;</button>
    </header>
    <p class="rh-assistant-hint">{{ hint }} Please don't paste customer personal details.</p>
    <div class="rh-assistant-log" aria-live="polite">
      <div class="rh-assistant-suggestions">
        {% for suggestion in suggestions %}
          <button type="button" data-question="{{ suggestion }}">{{ suggestion }}</button>
        {% endfor %}
      </div>
    </div>
    <form class="rh-assistant-form">
      <label class="rh-assistant-label" for="rh-assistant-question">Your question</label>
      <p class="rh-assistant-field" hidden></p>
      <div class="rh-assistant-input">
        <textarea id="rh-assistant-question" rows="2" maxlength="500" required
                  placeholder="{{ placeholder }}"></textarea>
        <button type="submit" class="button default" aria-label="Ask">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <p class="rh-assistant-keys">Enter to send · Shift+Enter for a new line</p>
    </form>
  </section>
</div>
<script src="{% static 'assistant/assistant.js' %}" defer></script>
{% endif %}
