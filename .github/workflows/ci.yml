name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resolvehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/resolvehub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings

      - name: Tests
        run: pytest

      - name: Production settings pass Django's deploy checklist
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: resolvehub.example
          STORAGE_BACKEND: s3
          S3_BUCKET_NAME: ci-placeholder
          S3_ENDPOINT_URL: https://placeholder.r2.cloudflarestorage.com
          S3_ACCESS_KEY_ID: placeholder
          S3_SECRET_ACCESS_KEY: placeholder

  image:
    # Builds the production image and starts it the way Coolify does, then
    # checks it answers over the proxy and reports healthy to Docker.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resolvehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t resolvehub .

      - name: Start a container
        run: |
          docker run -d --name app --network host \
            -e SECRET_KEY="$(openssl rand -base64 48)" \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/resolvehub \
            -e ALLOWED_HOSTS=resolvehub.example \
            -e S3_BUCKET_NAME=ci-placeholder \
            -e S3_ENDPOINT_URL=http://localhost:9000 \
            -e S3_ACCESS_KEY_ID=placeholder \
            -e S3_SECRET_ACCESS_KEY=placeholder \
            resolvehub

      - name: Docker reports the container healthy
        run: |
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' app)"
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 3
          done
          docker logs app
          exit 1

      - name: Sign-in page and static files are served through the proxy
        run: |
          proxy=(-H "Host: resolvehub.example" -H "X-Forwarded-Proto: https")
          test "$(curl -s -o /dev/null -w '%{http_code}' "${proxy[@]}" http://127.0.0.1:8000/admin/login/)" = 200
          css="$(curl -s "${proxy[@]}" http://127.0.0.1:8000/admin/login/ | grep -o '/static/admin/css/base\.[0-9a-f]*\.css' | head -1)"
          test -n "$css"
          test "$(curl -s -o /dev/null -w '%{http_code}' "${proxy[@]}" "http://127.0.0.1:8000$css")" = 200

      - name: Roles were created on start, and the app does not run as root
        run: |
          test "$(docker exec app python manage.py shell -c 'from django.contrib.auth.models import Group; print(Group.objects.count())' | tail -n 1)" = 3
          test "$(docker exec app id -u)" != 0

      - name: Container logs
        if: always()
        run: docker logs app || true
